[package]
name = "dimmed-clock"
version = "0.1.1"
description = "Fullscreen low-distraction clock for secondary monitors"
authors = ["Beanow"]
license = "MIT"
repository = "https://github.com/Beanow/dimmed-clock"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dimmed_clock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
