name: release-tauri

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CN_APPLICATION: beanow/dimmed-clock

jobs:
  Release:
    name: Release to CrabNebula Cloud
    # Bundles link against this runner's glibc, which sets the distro floor.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check release config
        run: |
          conf=src-tauri/tauri.conf.json
          version=$(jq -r .version $conf)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match $conf version $version"
            exit 1
          fi
          if jq -e '.plugins.updater.pubkey | startswith("REPLACE_")' $conf > /dev/null; then
            echo "::error::Set plugins.updater.pubkey in $conf"
            exit 1
          fi
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      # Updater artifacts need the signing key, so only enable them here.
      - run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
      - uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
      - uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
