name: build-site

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-site:
    name: Build site
    runs-on: ubuntu-latest
    # build.sh pushes the build to gh-pages.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: .github/build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
